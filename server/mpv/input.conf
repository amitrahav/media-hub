# Remote-friendly bindings. Keys the app needs to react to (OK, Back, digits for rating)
# are forwarded to it as `script-message mh key <name>`; transport keys stay native to mpv.
ENTER     script-message mh key select
KP_ENTER  script-message mh key select
ESC       script-message mh key back
BS        script-message mh key back
q         script-message mh key back
STOP      script-message mh key back
NEXT      script-message mh key next
SPACE     cycle pause
p         cycle pause
PLAYPAUSE cycle pause
PLAY      set pause no
PAUSE     set pause yes
LEFT      seek -10
RIGHT     seek 10
UP        seek 60
DOWN      seek -60
REWIND    seek -30
FORWARD   seek 30
m         cycle mute
s         cycle sub
a         cycle audio
0 script-message mh key 0
1 script-message mh key 1
2 script-message mh key 2
3 script-message mh key 3
4 script-message mh key 4
5 script-message mh key 5
6 script-message mh key 6
7 script-message mh key 7
8 script-message mh key 8
9 script-message mh key 9
# TV remote colour keys (see scripts/pi/cec-keymap.toml): blue = sources, red = subtitles, green = audio track.
F1 script-message mh key sources
F2 cycle sub
F3 cycle audio
