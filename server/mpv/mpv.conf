# Raspberry Pi 5: HEVC is hardware-decoded; H.264 is decoded on the CPU (fine up to 1080p).
hwdec=auto-safe
fullscreen=yes
keep-open=yes
force-window=immediate
osd-level=1
osd-font-size=44
osd-duration=2500
# Debrid links are plain HTTPS — buffer generously to ride out Wi-Fi hiccups.
cache=yes
demuxer-max-bytes=200MiB
demuxer-readahead-secs=60
# Pick the first English audio/subs when present.
alang=en,eng
slang=en,eng
